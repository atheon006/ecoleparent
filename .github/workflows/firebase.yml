name: Déploiement Firebase (sites école et parents + règles)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Compte de service Firebase (JSON) : Settings › Secrets and variables › Actions › Secrets.
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
    steps:
      - name: Configuration absente
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo 'Secret FIREBASE_SERVICE_ACCOUNT absent, déploiement ignoré (voir README).'
      - uses: actions/checkout@v4
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
      - uses: actions/setup-node@v4
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          node-version: 24
          cache: npm
      - name: Compilation et déploiement
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          npm ci
          cat > .env <<ENV
          VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_WEB_CLIENT_ID=${{ vars.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_ECOLE_URL=${{ vars.VITE_ECOLE_URL }}
          VITE_PARENT_URL=${{ vars.VITE_PARENT_URL }}
          VITE_PUSH_URL=${{ vars.VITE_PUSH_URL }}
          ENV
          npm run build
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@15 deploy --only hosting,firestore:rules,firestore:indexes --project "$PROJECT_ID" --non-interactive
